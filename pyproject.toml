[project]
name = "cartopy-backgrounds"
version = "0.1.0"
description = "CLI tool to download NASA satellite imagery backgrounds for Cartopy"
authors = [
    {name = "Markus Ritschel"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
examples = [
    "cartopy>=0.22.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.1.0",
]

[project.scripts]
cartopy-bg = "cartopy_backgrounds.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
